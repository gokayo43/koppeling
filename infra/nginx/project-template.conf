# Install to /etc/nginx/sites-enabled/project-template.example.com and reload.
# TLS is a Cloudflare Origin certificate (Full (strict)) — it is trusted only by
# Cloudflare, so this block must never be reachable except through the proxy.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name project-template.example.com;

    ssl_certificate /etc/ssl/cloudflare/project-template.pem;
    ssl_certificate_key /etc/ssl/cloudflare/project-template.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    server_tokens off;
    client_max_body_size 10m;

    # Security headers live here rather than in the app: one place per hostname,
    # and they still apply to responses the app never produced (502s, static
    # files served by nginx).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        proxy_pass http://127.0.0.1:5180;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
# scaffold:monorepo

# The API answers on a name of its own rather than a path under the one above,
# and this is where that decision is written down — everything else that
# mentions it points here.
#
# A shared hostname would need one prefix, and the browser's two clients do not
# read a prefixed origin alike. The Eden client appends its route to whatever
# origin it is handed, a prefixed one included, and would work. Better Auth's
# client refuses to append its own base path to an origin that already carries a
# path — `withPath` in better-auth/dist/utils/url.mjs returns the URL unchanged
# — so it would call the prefix itself and miss every auth route. That one is
# the asymmetry: a prefix would mean nginx stripping it, the server's basePath
# reconfigured to match, and the two clients held in step by hand for as long as
# the project lives. A second hostname costs a DNS record.
#
# So deploying this shape points api.project-template.example.com at this box as
# well, and the origin certificate has to carry both names — a Cloudflare origin
# cert is issued for a list, and *.example.com does not match a name two labels
# deep.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.project-template.example.com;

    ssl_certificate /etc/ssl/cloudflare/project-template.pem;
    ssl_certificate_key /etc/ssl/cloudflare/project-template.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    server_tokens off;
    client_max_body_size 10m;

    # Repeated rather than shared: add_header is per-server and inherits into
    # nothing, so the alternative is a snippet that is a second file to install.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        proxy_pass http://127.0.0.1:5181;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
# scaffold:monorepo

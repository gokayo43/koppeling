# Install/refresh with: bun run hooks
#
# Staged files only, on commit: the whole-project checks run once, in CI, on the
# state that lands.

pre-commit:
  parallel: true
  commands:
    format:
      glob: "*.{js,ts,json,md}"
      # dist/ is a committed build artifact that oxfmt ignores, and oxfmt EXITS
      # NON-ZERO when every file it was handed was excluded, so the commit that
      # carries a rebuilt dist/ and nothing else would be refused.
      exclude:
        - "dist/**"
      run: bunx oxfmt --check {staged_files}
    lint:
      glob: "*.{js,ts}"
      exclude:
        - "dist/**"
      # The same flag the `lint` script and CI carry: a directive that no longer
      # suppresses anything is an error there, so it has to be one here too.
      run: bunx oxlint --report-unused-disable-directives-severity=error {staged_files}
    secrets:
      # --staged scans the index rather than the working tree, so a commit is
      # judged by what it actually contains.
      run: gitleaks git --staged --redact --no-banner .

commit-msg:
  commands:
    commitlint:
      run: bunx commitlint --edit {1}

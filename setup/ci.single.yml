name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    uses: gokayo43/dev-config/.github/workflows/check.yml@602fca2f24341ef9c445b4a6f750e887cf156f37 # v0.50.1
    with:
      # src/routeTree.gen.ts is generated by the TanStack Start vite plugin and
      # is not committed, so a clean checkout has no route types until a build —
      # both tsc and the type-aware lint rules would report them as missing.
      build: true
      # `lifecycle: "live"` in package.json is what requires `upgrade-gate: true`
      # beside this — docs/gates/repo-contract.md in dev-config.
      database: true
      compose: true
      # No `mutation-floor` beside it, deliberately — CLAUDE.md's "CI" says why.
      mutation-lane: true
      # The ramp runs with the database job; what a repo chooses is what it
      # hits. docs/gates/capacity.md in dev-config has what the number is worth,
      # and scripts/preview-capacity.sh is where the capacity claim comes from.
      # Both pages and the auth splat: everything the app serves besides the
      # health route the ramp already holds. With no cookie get-session
      # short-circuits to null rather than reading a session, so what it measures
      # is the auth pipeline. Point these at whatever the project serves once it
      # serves something.
      capacity-path: |
        /
        /login
        /api/auth/get-session
      # The one route that answers a method the shipped ramp has no way to send:
      # a sign-up POST per request would write a user per request, which is a
      # different scenario and a script of its own.
      route-allowlist: |
        POST /api/auth/$ -- the shipped ramp only issues GETs and a sign-up POST would write a user per request

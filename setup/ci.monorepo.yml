name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    uses: gokayo43/dev-config/.github/workflows/check.yml@602fca2f24341ef9c445b4a6f750e887cf156f37 # v0.50.1
    with:
      # Turbo's `--affected`, which check.yml hands to the typecheck lane on a
      # pull request. Only that lane: the build below writes the generated
      # sources the repo-wide lint, knip and root typecheck then read, so
      # narrowing it would leave them reading files nothing wrote this run.
      affected: true
      # src/routeTree.gen.ts is generated by the TanStack Start vite plugin and
      # is not committed, so a clean checkout has no route types until a build —
      # both tsc and the type-aware lint rules would report them as missing.
      build: true
      # `lifecycle: "live"` in package.json is what requires `upgrade-gate: true`
      # beside this — docs/gates/repo-contract.md in dev-config.
      database: true
      compose: true
      # The ramp runs with the database job; what a repo chooses is what it
      # hits. docs/gates/capacity.md in dev-config has what the number is worth,
      # and scripts/preview-capacity.sh is where the capacity claim comes from.
      # The gate supplies the house server env — SITE_URL and the secret — and
      # this shape needs one more: the origin the API answers on, which is what
      # its auth issues URLs from. Here that is the port it is about to bind.
      start-command: PUBLIC_API_URL=http://127.0.0.1:3001 bun run --cwd apps/api start
      health-url: http://localhost:3001/health
      # The only route a fresh scaffold has besides health. With no cookie it
      # short-circuits to null rather than reading a session, so what it
      # measures is the CORS and auth pipeline — still a second surface, and
      # more than ramping the health route twice. Point this at whatever the
      # project actually serves once it serves something.
      capacity-path: /api/auth/get-session
      # Not "no load generator sends a preflight": @elysiajs/cors answers every
      # OPTIONS by short-circuiting the lifecycle, so route-log never counts
      # these two whatever reaches them. Every route the app can report is
      # ramped — docs/gates/capacity.md.
      route-allowlist: |
        OPTIONS / -- answered by @elysiajs/cors before the request reaches a route
        OPTIONS /* -- answered by @elysiajs/cors before the request reaches a route

name: project-template

# Every port binds to 127.0.0.1: nginx is the only thing that reaches these, and
# the host firewall is not the only line of defence. Memory limits are not
# optional either — several unrelated stacks share this box, and without caps the
# kernel OOM killer picks its victim by score rather than by who caused the spike.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: project_template
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: project_template
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - effective_cache_size=384MB
      - -c
      - max_connections=25
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5435}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U project_template -d project_template"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # noeviction: this instance holds locks and queue state, not a disposable
    # cache — silently dropping a key under memory pressure would lose work.
    command:
      - redis-server
      - --maxmemory
      - 192mb
      - --maxmemory-policy
      - noeviction
      - --appendonly
      - "yes"
    ports:
      - "127.0.0.1:${REDIS_PORT:-6381}:6379"
    volumes:
      - redisdata:/data
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30

  # Applies pending drizzle migrations, then exits. Everything else waits on it
  # completing successfully, so a failed migration keeps the old containers
  # running rather than starting new ones against a schema they do not match.
  migrate:
    build:
      context: .
      dockerfile: Dockerfile.api
      target: deps
    command: ["bun", "run", "--cwd", "apps/api", "db:migrate"]
    environment:
      DATABASE_URL: postgres://project_template:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/project_template
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 512m
    restart: "no"
    x-no-healthcheck: "apps/api/tests/migrate.test.ts -- one-shot job; it applies the migrations and returns, so there is no steady state to probe"

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
      target: runtime
    restart: unless-stopped
    # Which environment's origins this stack runs at: the deployed pair by
    # default, the preview's where scripts/preview.sh names its own file. Both
    # keys come from there — SITE_URL is the browser the API trusts and answers
    # CORS for, PUBLIC_API_URL is this program's own public origin, what Better
    # Auth mints URLs from and what decides whether the session cookie can reach
    # the web app at all (apps/api/src/cookie-domain.ts). The same file the web
    # build below bakes into the browser bundle, so the two ends of one call
    # cannot disagree about where this answers — and a file rather than a
    # `${SITE_URL}` out of .env, because .env is a checkout's own dev
    # environment and this box is a deploy target as well as a checkout.
    env_file:
      - ${ORIGINS_ENV:-deploy.env}
    environment:
      DATABASE_URL: postgres://project_template:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/project_template
      REDIS_URL: redis://redis:6379
      PORT: 3001
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET in .env}
      SENTRY_DSN: ${SENTRY_DSN:-}
    ports:
      - "127.0.0.1:${API_PORT:-5181}:3001"
    mem_limit: 512m
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # The oven/bun image carries no curl or wget, so the probe is bun itself.
    # /health answers 503 when a datastore is unreachable or the database is
    # missing this schema, and a non-2xx has to fail the check — hence the
    # explicit r.ok test.
    healthcheck:
      test:
        - CMD
        - bun
        - -e
        - fetch('http://localhost:3001/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      target: runtime
      args:
        # Vite inlines import.meta.env at build time, so the API origin is baked
        # into the bundle here rather than read from the container's env — and
        # compose cannot hand a build the env_file its services read, so what
        # travels is the file's name and Dockerfile.web reads the origin out of
        # it. Nothing this image runs reads an origin: the bundle carries it.
        ORIGINS_ENV: ${ORIGINS_ENV:-deploy.env}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_PORT:-5180}:3000"
    mem_limit: 1g
    depends_on:
      api:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - bun
        - -e
        - fetch('http://localhost:3000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # scaffold:worker
  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
      target: runtime
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://project_template:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/project_template
      REDIS_URL: redis://redis:6379
    mem_limit: 512m
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    x-no-healthcheck: "apps/worker/tests/exit.test.ts -- no socket, and a tick that keeps failing ends the process, so the container still being up is the report a probe would have given"
  # scaffold:worker

volumes:
  pgdata:
  redisdata:

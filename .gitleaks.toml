# Extends gitleaks' default rules; the allowlist below is the only deviation.
[extend]
useDefault = true

# The bind and app suites boot the real server with a deliberately fake
# BETTER_AUTH_SECRET whose name says what it is. It lives in test source and
# in history, so a line-level gitleaks:allow cannot cover the commits that
# introduced it — this repo-level allowlist can, and it ships with the
# scaffold, whose copies of those tests would otherwise fail their own
# secret-scan on day one.
[allowlist]
regexes = ['''probe-secret-that-is-long-enough''']

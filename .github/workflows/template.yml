name: Template

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: template-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The scaffolder is this repo's product, so the gate is: scaffold each shape
  # and run the gate the scaffolded repo would run. It cannot call dev-config's
  # check.yml — a reusable workflow checks out the caller, not a tree a step in
  # it just created — but the steps that matter are that workflow's own
  # composite actions, so both run one copy of them, fed from the ci.yml the
  # scaffolder installed. setup/ci.<shape>.yml is what proves the call itself,
  # once a scaffolded repo pushes.
  scaffold:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - shape: single
            upgradeGate: "false"
          - shape: monorepo
            # The scaffold's base ref is its own empty first commit, which
            # carries no migration lineage — the scaffolder generates one on top
            # — so the gate resolves the base ref, finds nothing there to
            # upgrade from, and passes. What that proves here is the wiring and
            # the base-ref resolution, on a real event; the property, and the
            # lineage reading, are dev-config's own fixtures.
            upgradeGate: "true"

    services:
      postgres:
        image: postgres:16-alpine@sha256:20edbde7749f822887a1a022ad526fde0a47d6b2be9a8364433605cf65099416
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
      redis:
        image: redis:7-alpine@sha256:8b81dd37ff027bec4e516d41acfbe9fe2460070dc6d4a4570a2ac5b9d59df065
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      REDIS_URL: redis://localhost:6379
      # The scaffolder deletes itself, so it runs against a copy and the
      # checkout survives to be gated in its own right at the end.
      SCAFFOLD: ${{ github.workspace }}-scaffold

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # gitleaks reads history, and a shallow clone has none.
          fetch-depth: 0
          # This job resolves and runs a scaffolded tree's dependencies in the
          # same workspace, and nothing here pushes.
          persist-credentials: false

      - uses: gokayo43/dev-config/.github/actions/secret-scan@55e57c943d8de9e6120d3fd1a7daf7a70315c581 # v0.50.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      # This repo's own YAML: template.yml, plus everything under setup/, which
      # GitHub never runs here — that is the CI the scaffolder installs into the
      # new repo. The pin check parses the YAML, so Bun comes first, and the
      # glob stays whatever the directory holds.
      - uses: gokayo43/dev-config/.github/actions/lint-workflows@55e57c943d8de9e6120d3fd1a7daf7a70315c581 # v0.50.0
        with:
          extra-paths: setup/*.yml

      # Resolves every dependency at today's versions under the seven-day
      # release-age policy, exactly as a real scaffold does.
      #
      # The copy gets its own history rather than this repo's. Every gate below
      # reads the tree through git, and one of them — the repo contract — now
      # compares `lifecycle` with the base ref's: carrying this repo's .git over
      # would grade a brand-new repo against the template's own commits, which
      # is a verdict about the wrong tree and would go wrong the day the
      # template's own field moved. A scaffold's honest history is an empty
      # repository and everything the scaffolder wrote on top of it.
      - name: Scaffold
        env:
          SHAPE: ${{ matrix.shape }}
        run: |
          set -euo pipefail
          cp -a "$GITHUB_WORKSPACE" "$SCAFFOLD"
          cd "$SCAFFOLD"
          rm -rf .git
          # Before the scaffolder, not after: `lefthook install` writes into
          # .git/hooks, and a scaffold with no remote is what makes it skip the
          # issue-label reconciliation it has no repo to reconcile against.
          git init --quiet --initial-branch=main
          git config user.email gate@example.com
          git config user.name gate
          git commit --quiet --allow-empty --message "Empty repository"
          bun run setup --name "gate-$SHAPE" --hostname "gate-$SHAPE.example.com" \
            --shape "$SHAPE" --worker --yes
          git add --all
          # --no-verify: the scaffolder has just run `lefthook install`, so this
          # commit would otherwise fire the hooks it wrote. Two of them, and
          # each is safe to skip for its own reason. pre-commit shells out to
          # gitleaks, which is not on the runner — and the scan it stands for is
          # run below in its own right, against this whole generated history
          # rather than a staged diff. commit-msg runs commitlint, which would
          # reject "Scaffold gate-<shape>" for having no conventional type; that
          # hook grades a message this job invented for a commit no human will
          # read, and nothing about the tree depends on it.
          git commit --quiet --no-verify --message "Scaffold gate-$SHAPE"
          # The base every gate below resolves is that empty commit, on either
          # event: a push names a `before` from this repo's history, which is
          # not an object here, and the fallback is HEAD^. A pull request names
          # a branch instead, so the branch is put where the same commit is.
          # Both legs then read the one true story — a new repo, and the
          # scaffolder's output on top of nothing.
          if [ -n "${GITHUB_BASE_REF:-}" ]; then
            git update-ref "refs/remotes/origin/$GITHUB_BASE_REF" HEAD^
          fi

      # The scan above read this repo. This one reads what the scaffolder wrote,
      # which no scan of the checkout can see — and it is what makes the
      # --no-verify above honest: the pre-commit hook's gitleaks is skipped
      # there and run here, over the whole generated history rather than a diff.
      - uses: gokayo43/dev-config/.github/actions/secret-scan@55e57c943d8de9e6120d3fd1a7daf7a70315c581 # v0.50.0
        with:
          working-directory: ${{ env.SCAFFOLD }}

      # The declarative half of the gate, against the tree the scaffolder just
      # produced — which is the only tree that has one.
      - uses: gokayo43/dev-config/.github/actions/repo-contract@55e57c943d8de9e6120d3fd1a7daf7a70315c581 # v0.50.0
        with:
          working-directory: ${{ env.SCAFFOLD }}
          database: true

      - uses: gokayo43/dev-config/.github/actions/stack-gate@55e57c943d8de9e6120d3fd1a7daf7a70315c581 # v0.50.0
        with:
          working-directory: ${{ env.SCAFFOLD }}

      - uses: gokayo43/dev-config/.github/actions/suppression-hygiene@55e57c943d8de9e6120d3fd1a7daf7a70315c581 # v0.50.0
        with:
          working-directory: ${{ env.SCAFFOLD }}

      - uses: gokayo43/dev-config/.github/actions/shell-scripts@55e57c943d8de9e6120d3fd1a7daf7a70315c581 # v0.50.0
        with:
          working-directory: ${{ env.SCAFFOLD }}

      - uses: gokayo43/dev-config/.github/actions/compose-lint@55e57c943d8de9e6120d3fd1a7daf7a70315c581 # v0.50.0
        with:
          working-directory: ${{ env.SCAFFOLD }}

      # No build step: the scaffolder runs the first one itself, which is what
      # gives a fresh repo its route types, and this is where that claim is
      # checked. A second build over the first one's output would prove nothing
      # `bun run check` does not prove a line later — and if the scaffolder ever
      # stopped building, this is the step that goes red.
      - run: bun run check
        working-directory: ${{ env.SCAFFOLD }}

      - uses: gokayo43/dev-config/.github/actions/test-suite@55e57c943d8de9e6120d3fd1a7daf7a70315c581 # v0.50.0
        with:
          working-directory: ${{ env.SCAFFOLD }}
          test-suite-evidence: test-suite-evidence-${{ matrix.shape }}

      # Stricter here than on any pull request: the base ref is the scaffold's
      # empty first commit, so every line of src/domain/ is one this "branch"
      # wrote and a single undetected mutant fails the job. Single shape only:
      # the monorepo's .oxlintrc.json declares no `domain` element for the lane
      # to read (gokayo43/project-template#29). The bound sits here because a
      # composite action's own steps take no timeout-minutes.
      - if: matrix.shape == 'single'
        timeout-minutes: 10
        uses: gokayo43/dev-config/.github/actions/mutation-lane@55e57c943d8de9e6120d3fd1a7daf7a70315c581 # v0.50.0
        with:
          working-directory: ${{ env.SCAFFOLD }}

      # Read from the workflow the scaffolder actually installed, so this job
      # ramps what a scaffolded repo's CI would ramp. A copy in this matrix
      # would be a second answer to a question setup/ci.<shape>.yml has already
      # answered, and the two would drift the first time only one was edited.
      - name: What the shipped workflow asks for
        id: shipped
        run: |
          set -euo pipefail
          # The ${} below are JS template literals, not shell expansions.
          # shellcheck disable=SC2016
          bun -e '
            const file = `${process.env.SCAFFOLD}/.github/workflows/ci.yml`;
            const asked = Bun.YAML.parse(await Bun.file(file).text()).jobs.check.with ?? {};
            const out = [];
            for (const name of ["start-command", "health-url", "capacity-path", "route-allowlist"]) {
              const value = String(asked[name] ?? "");
              // The heredoc form, because route-allowlist is a block scalar and
              // a bare KEY=VALUE stops at the first newline.
              out.push(`${name}<<SHIPPED_EOF`, value, "SHIPPED_EOF");
            }
            await Bun.write(process.env.GITHUB_OUTPUT, `${out.join("\n")}\n`, { createPath: false });
          '
          cat "$GITHUB_OUTPUT"

      - uses: gokayo43/dev-config/.github/actions/db-gate@55e57c943d8de9e6120d3fd1a7daf7a70315c581 # v0.50.0
        with:
          working-directory: ${{ env.SCAFFOLD }}
          upgrade-gate: ${{ matrix.upgradeGate }}
          # The single shape names no start-command or health-url: it takes
          # check.yml's defaults, and an empty string here would override them
          # with nothing. db-gate's own defaults are the same two values.
          start-command: ${{ steps.shipped.outputs.start-command || 'bun run start' }}
          health-url: ${{ steps.shipped.outputs.health-url || 'http://localhost:3000/api/health' }}
          capacity-path: ${{ steps.shipped.outputs.capacity-path }}
          db-gate-evidence: db-gate-evidence-${{ matrix.shape }}
          route-allowlist: ${{ steps.shipped.outputs.route-allowlist }}

      # The scaffolder is what a scaffolded gate can never see: it deletes
      # itself, and setup/ with it. It is held to the same four checks here,
      # against the dependencies the scaffold just resolved. Once, not per
      # shape: it is one shape-independent program, and the single-app tree is
      # the one whose root carries everything its tsconfig names — the monorepo
      # keeps vite under apps/web.
      #
      # setup.test.ts is the fourth: the shape-specific half of the scaffolder is
      # four trees that cannot see each other — the staged setup/monorepo/
      # content, its turbo.json, the root scripts in root-scripts.json, and what
      # the apps read out of the environment. Every way those can disagree is
      # green in the matrix above: a lane declared and never routed, a lane
      # routed and never declared, and a dev task whose passThroughEnv has
      # stopped covering what the programs read — which turbo's strict env mode
      # turns into a dev server reading undefined where worktree.ts had just put
      # the right answer. The scaffold gate boots the API, it never runs `dev`.
      #
      # Formatting is checked over the whole template tree, and it is the only
      # check that has to be: the scaffolder runs `oxfmt .` as its last act, so
      # a mis-formatted file in this repo is laundered on the way into every
      # scaffold and the gate above never sees it. Nothing else is: a lint or a
      # type error surfaces in whichever shape carries that file, because no
      # step of the scaffolder fixes either.
      #
      # Markdown is left out, and only here: oxfmt reflows paragraphs around the
      # `<!-- scaffold:… -->` markers this tree carries and the scaffolded copies
      # do not, so the two cannot both be held to it. The copies are, above.
      # Types are left out for a plainer reason: `tsc` over this tree wants
      # `routeTree.gen.ts`, which a build writes and nothing here builds.
      - name: Gate the scaffolder and this tree's formatting
        if: matrix.shape == 'single'
        run: |
          set -euo pipefail
          ln -s "$SCAFFOLD/node_modules" node_modules
          bunx tsc --noEmit -p tsconfig.setup.json
          bunx oxlint --report-unused-disable-directives-severity=error setup.ts setup/dependencies.ts
          bun test ./setup.test.ts
          bunx oxfmt --check . '!**/*.md'
